# Integration harness; the tests create the certs and set CERTS_DIR (see conftest.py).
services:
  greenmail:
    # Version vetted in docs/research/v2-greenmail.md; the digest pins the exact image.
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    environment:
      # Replaces the default opts in full, which drops -Dgreenmail.auth.disabled.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:pw-a@example.com,bob:pw-b@example.com
        -Dgreenmail.users.login=email
        -Dgreenmail.tls.keystore.file=/certs/greenmail.p12
        -Dgreenmail.tls.keystore.password=${KEYSTORE_PASSWORD:?set by the test harness}
        -Dgreenmail.tls.key.password=${KEYSTORE_PASSWORD:?set by the test harness}
    ports:
      - "127.0.0.1:3143:3143"
      - "127.0.0.1:3993:3993"
    volumes:
      - "${CERTS_DIR:?set by the test harness}:/certs:ro"
